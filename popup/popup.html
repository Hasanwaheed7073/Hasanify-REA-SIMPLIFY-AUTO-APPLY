<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hasanify</title>
  <link rel="stylesheet" href="../ui/theme.css" />
  <style>
    body { width: 360px; }
    .top { display: flex; align-items: center; gap: 10px; padding: 14px 14px 11px 16px; border-bottom: 2px solid var(--ink); margin: 0 0 0; }
    .top img { border-radius: 3px; }
    .top b { font: 600 19px var(--serif); letter-spacing: -.01em; flex: 1; }
    .icon-btn { width: 30px; height: 30px; border: 0; border-radius: 3px; background: none; color: var(--muted); display: grid; place-items: center; transition: background .15s, color .15s; }
    .icon-btn:hover { background: var(--soft); color: var(--ink); }
    .icon-btn svg { width: 17px; height: 17px; }

    /* "hero": the page you're on, as a ruled entry — no gradient */
    .hero { margin: 0 16px; padding: 14px 0 16px; border-bottom: 1px solid var(--line-2); }
    .status { display: inline-flex; align-items: center; gap: 7px; font: 500 11.5px var(--mono); color: var(--ok); }
    .status i { width: 7px; height: 7px; border-radius: 1px; background: currentColor; }
    .status.off { color: var(--muted); }
    .hero h2 { margin: 8px 0 2px; font-size: 21px; letter-spacing: -.01em; line-height: 1.2; }
    .hero p { margin: 0; font-size: 12.5px; color: var(--muted); }
    .fill { margin-top: 14px; width: 100%; height: 40px; border: 1px solid var(--brand); border-radius: 4px;
      background: var(--brand); color: #FBF6EF; font-weight: 650; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s, border-color .15s, transform .1s; }
    .fill:hover { background: var(--brand-ink); border-color: var(--brand-ink); }
    .fill:active { transform: translateY(1px); }
    .fill:disabled { opacity: .6; cursor: default; transform: none; }
    .fill svg { width: 16px; height: 16px; }

    .quick { margin-top: 8px; width: 100%; height: 36px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--sheet); color: var(--ink);
      font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, border-color .15s; }
    .quick:hover { background: #fff; border-color: var(--ink-2); }
    .quick:disabled { opacity: .6; cursor: default; }
    .quick svg { width: 15px; height: 15px; }
    .quick kbd { font: 500 10.5px var(--mono); padding: 1px 5px; border-radius: 2px; border: 1px solid var(--line-2); color: var(--muted); background: var(--paper); }
    .results { display: grid; grid-template-columns: 1fr 1fr; margin: 0 16px; border-bottom: 1px solid var(--line-2); }
    .results.hidden { display: none; }
    .res { padding: 10px 0 12px; }
    .res + .res { border-left: 1px solid var(--line); padding-left: 14px; }
    .res b { font: 600 26px/1.1 var(--serif); letter-spacing: -.02em; display: block; }
    .res span { font: 11.5px var(--mono); color: var(--muted); }
    .res.ok b { color: var(--ok); }
    .res.warn b { color: var(--brand); }

    .profile { display: flex; align-items: center; gap: 12px; margin: 0 16px; padding: 12px 0; border-bottom: 1px solid var(--line-2);
      text-decoration: none; color: inherit; cursor: pointer; transition: background .15s; }
    .profile:hover .txt b { text-decoration: underline; text-underline-offset: 3px; }
    .profile .txt { flex: 1; min-width: 0; }
    .profile .txt b { display: block; font-size: 13.5px; }
    .profile .txt span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chev { width: 16px; height: 16px; color: var(--faint); }

    .settings { margin: 0 16px; padding: 2px 0; }
    .settings .switch-row { padding: 10px 0; }
    .settings .switch-row:first-child { padding-top: 10px; border-top: 0; }
    .settings .switch-row b { font-size: 13px; font-weight: 500; }

    .foot { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 13px; border-top: 1px solid var(--line-2); font: 11.5px var(--mono); color: var(--faint); }
    .foot a { color: var(--brand); font: 600 12.5px var(--font); text-decoration: none; cursor: pointer; }
    .foot a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .foot a.muted-link { color: var(--muted); font: 500 12px var(--font); }
  </style>
</head>
<body>
  <div class="top">
    <img src="../icons/icon-32.png" width="28" height="28" alt="" />
    <b>Hasanify</b>
    <button class="icon-btn" id="settingsBtn" title="Open dashboard" data-icon-btn="gear"></button>
  </div>

  <section class="hero">
    <span class="status off" id="status"><i></i><span id="statusText">Checking page…</span></span>
    <h2 id="heroTitle">Autofill your application</h2>
    <p id="heroSub">Fill every field Hasanify recognizes in one click.</p>
    <button class="fill" id="fill" data-icon-btn="bolt"><span id="fillText">Autofill this page</span></button>
    <button class="quick" id="quickCopy" data-icon-btn="copy"><span>Quick access — my details</span><kbd>Alt+Shift+C</kbd></button>
  </section>

  <div class="results hidden" id="results">
    <div class="res ok"><b id="filled">0</b><span>fields filled</span></div>
    <div class="res warn"><b id="todo">0</b><span>left for you</span></div>
  </div>

  <a class="profile" id="profileCard">
    <div class="ring" id="ring" data-v="0%" style="--size:42px"></div>
    <div class="txt"><b id="profileTitle">Your profile</b><span id="profileHint"></span></div>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
  </a>

  <div class="settings">
    <div class="switch-row"><div><b>Autofill on job sites</b></div><label class="switch"><input type="checkbox" data-setting="autoFillOnKnownATS" /><i></i></label></div>
    <div class="switch-row"><div><b>Show on-page assistant</b></div><label class="switch"><input type="checkbox" data-setting="showWidget" /><i></i></label></div>
  </div>

  <div class="foot"><a id="diagLink" class="muted-link" title="Copies the structure of this page's form (no personal values) to send for support">Copy diagnostics</a><a id="dashLink">Open dashboard</a></div>

  <script src="../shared/profile-schema.js"></script>
  <script src="../ui/icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
