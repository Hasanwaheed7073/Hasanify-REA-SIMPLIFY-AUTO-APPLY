<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hasanify</title>
  <link rel="stylesheet" href="../ui/theme.css" />
  <style>
    body { width: 360px; background: #fff; }
    .top { display: flex; align-items: center; gap: 10px; padding: 14px 14px 12px 16px; }
    .top img { border-radius: 8px; }
    .top b { font-size: 16px; letter-spacing: -.02em; flex: 1; }
    .icon-btn { width: 32px; height: 32px; border: 0; border-radius: 9px; background: none; color: var(--muted); display: grid; place-items: center; }
    .icon-btn:hover { background: var(--soft); color: var(--ink); }
    .icon-btn svg { width: 18px; height: 18px; }

    .hero { margin: 0 14px; padding: 16px; border-radius: 16px; color: #fff; position: relative; overflow: hidden;
      background: radial-gradient(120% 140% at 100% 0%, #8B5CF6 0%, #5B5BF7 45%, #3B3BC4 100%); }
    .hero::after { content: ""; position: absolute; right: -40px; bottom: -60px; width: 160px; height: 160px; border-radius: 50%;
      background: rgba(255,255,255,.08); }
    .status { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 8px; border-radius: 99px;
      background: rgba(255,255,255,.16); font-size: 11.5px; font-weight: 600; }
    .status i { width: 7px; height: 7px; border-radius: 50%; background: #A7F3D0; box-shadow: 0 0 0 3px rgba(167,243,208,.25); }
    .status.off i { background: #CBD5E1; box-shadow: none; }
    .hero h2 { margin: 10px 0 2px; font-size: 17px; letter-spacing: -.015em; line-height: 1.3; position: relative; z-index: 1; }
    .hero p { margin: 0; font-size: 12.5px; opacity: .85; position: relative; z-index: 1; }
    .fill { position: relative; z-index: 1; margin-top: 14px; width: 100%; height: 44px; border: 0; border-radius: 12px;
      background: #fff; color: #3B3BC4; font-weight: 700; font-size: 14.5px; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 6px 16px -6px rgba(0,0,0,.35); transition: transform .1s, box-shadow .15s; }
    .fill:hover { box-shadow: 0 10px 22px -8px rgba(0,0,0,.4); }
    .fill:active { transform: translateY(1px); }
    .fill:disabled { opacity: .75; cursor: default; }
    .fill svg { width: 17px; height: 17px; }

    .quick { position: relative; z-index: 1; margin-top: 8px; width: 100%; height: 38px; border-radius: 11px;
      border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; font-weight: 600; font-size: 13px;
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s; }
    .quick:hover { background: rgba(255,255,255,.2); }
    .quick:disabled { opacity: .6; cursor: default; }
    .quick svg { width: 15px; height: 15px; }
    .quick kbd { font: 600 10.5px var(--font); padding: 2px 6px; border-radius: 5px; background: rgba(255,255,255,.18); opacity: .9; }
    .results { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 14px 0; }
    .results.hidden { display: none; }
    .res { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .res b { font-size: 20px; letter-spacing: -.02em; display: block; line-height: 1.2; }
    .res span { font-size: 12px; color: var(--muted); }
    .res.ok b { color: #039855; }
    .res.warn b { color: var(--warn); }

    .profile { display: flex; align-items: center; gap: 12px; margin: 12px 14px 0; padding: 12px; border-radius: 14px;
      border: 1px solid var(--line); text-decoration: none; color: inherit; cursor: pointer; transition: background .12s; }
    .profile:hover { background: var(--soft); }
    .profile .txt { flex: 1; min-width: 0; }
    .profile .txt b { display: block; font-size: 13.5px; }
    .profile .txt span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chev { width: 18px; height: 18px; color: var(--faint); }

    .settings { margin: 12px 14px 0; padding: 4px 14px; border-radius: 14px; background: var(--soft); }
    .settings .switch-row { padding: 11px 0; border-color: #E4E6EE; }
    .settings .switch-row:first-child { padding-top: 11px; }
    .settings .switch-row b { font-size: 13px; }

    .foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 14px; font-size: 12px; color: var(--faint); }
    .foot a { color: var(--brand); font-weight: 600; text-decoration: none; cursor: pointer; }
    .foot a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="top">
    <img src="../icons/icon-32.png" width="28" height="28" alt="" />
    <b>Hasanify</b>
    <button class="icon-btn" id="settingsBtn" title="Open dashboard" data-icon-btn="gear"></button>
  </div>

  <section class="hero">
    <span class="status off" id="status"><i></i><span id="statusText">Checking page…</span></span>
    <h2 id="heroTitle">Autofill your application</h2>
    <p id="heroSub">Fill every field Hasanify recognizes in one click.</p>
    <button class="fill" id="fill" data-icon-btn="bolt"><span id="fillText">Autofill this page</span></button>
    <button class="quick" id="quickCopy" data-icon-btn="copy"><span>Quick access — my details</span><kbd>Alt+Shift+C</kbd></button>
  </section>

  <div class="results hidden" id="results">
    <div class="res ok"><b id="filled">0</b><span>fields filled</span></div>
    <div class="res warn"><b id="todo">0</b><span>left for you</span></div>
  </div>

  <a class="profile" id="profileCard">
    <div class="ring" id="ring" data-v="0%" style="--size:42px"></div>
    <div class="txt"><b id="profileTitle">Your profile</b><span id="profileHint"></span></div>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
  </a>

  <div class="settings">
    <div class="switch-row"><div><b>Autofill on job sites</b></div><label class="switch"><input type="checkbox" data-setting="autoFillOnKnownATS" /><i></i></label></div>
    <div class="switch-row"><div><b>Show on-page assistant</b></div><label class="switch"><input type="checkbox" data-setting="showWidget" /><i></i></label></div>
  </div>

  <div class="foot"><span>Alt+Shift+F to autofill</span><a id="dashLink">Open dashboard</a></div>

  <script src="../shared/profile-schema.js"></script>
  <script src="../ui/icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
